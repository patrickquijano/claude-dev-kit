---
name: Release Check

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

concurrency:
  group: release-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-check:
    name: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: sh
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Run release-check tests
        run: npm test

      - name: Validate changelog and version
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node hooks/scripts/release-check.mjs check --ci --target "$BASE_REF"
