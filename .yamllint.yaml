---
# Aligned with .yamlfmt.yaml and the .prettierrc.json YAML override.
extends: default

ignore: |
  node_modules/
  package-lock.json
  .husky/_/
  .remember/
  .claude/prompts/
  evals/results/

rules:
  line-length: disable
  truthy: {check-keys: false}
  indentation: {spaces: 2}
  quoted-strings: {required: only-when-needed}
